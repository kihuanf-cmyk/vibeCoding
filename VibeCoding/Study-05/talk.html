<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="오늘의 마음을 한 줄로 남기고 따뜻한 AI 응답을 받아보세요.">
  <title>오늘의 마음 한 줄</title>
  <style>
    :root {
      --ink: #2f332e;
      --muted: #777a70;
      --paper: #fffdf8;
      --cream: #f7f0e4;
      --sage: #a9b8a0;
      --deep-sage: #536652;
      --peach: #e7b49c;
      --line: #e4ded3;
      --danger: #a85e52;
      --shadow: 0 20px 60px rgba(82, 76, 59, .12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--cream);
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      line-height: 1.6;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(circle at 12% 10%, rgba(231, 180, 156, .3), transparent 28%),
                  radial-gradient(circle at 92% 84%, rgba(169, 184, 160, .35), transparent 31%);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(83, 102, 82, .35); outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .shell { width: min(100% - 32px, 780px); margin: 0 auto; padding: 64px 0 72px; }
    .masthead { margin-bottom: 28px; }
    .eyebrow { margin: 0 0 8px; color: var(--deep-sage); font-size: .78rem; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 0; font-family: Georgia, "Malgun Gothic", serif; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 500; letter-spacing: -.04em; line-height: 1.15; }
    .intro { max-width: 540px; margin: 14px 0 0; color: var(--muted); }

    .entry-card, .result-panel, .history { background: rgba(255, 253, 248, .9); border: 1px solid rgba(228, 222, 211, .85); box-shadow: var(--shadow); }
    .entry-card { padding: clamp(22px, 5vw, 38px); border-radius: 8px; }
    .field-label { display: block; margin-bottom: 10px; font-weight: 700; }
    .field-hint { margin: 0 0 14px; color: var(--muted); font-size: .9rem; }
    .entry-row { display: flex; gap: 10px; }
    .entry-input { width: 100%; min-width: 0; padding: 14px 16px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 5px; }
    .entry-input::placeholder { color: #a2a298; }
    .entry-input[aria-invalid="true"] { border-color: var(--danger); }
    .submit-button { flex: 0 0 auto; min-width: 112px; padding: 12px 18px; color: #fff; background: var(--deep-sage); border: 0; border-radius: 5px; font-weight: 700; transition: background .2s ease, transform .2s ease; }
    .submit-button:hover:not(:disabled) { background: #40503f; transform: translateY(-1px); }
    .submit-button:disabled { cursor: wait; opacity: .62; }
    .field-error { min-height: 1.5em; margin: 8px 0 0; color: var(--danger); font-size: .88rem; }
    .status { min-height: 1.6em; margin: 18px 0 0; color: var(--muted); font-size: .9rem; }
    .status.error { color: var(--danger); }
    .status.success { color: var(--deep-sage); }
    .status-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    .status-row .status { flex: 1; margin: 0; }
    .retry-button { display: none; flex: 0 0 auto; padding: 7px 11px; color: var(--deep-sage); background: transparent; border: 1px solid var(--sage); border-radius: 4px; font-size: .82rem; font-weight: 700; }
    .retry-button.visible { display: inline-block; }
    .retry-button:hover { background: rgba(169, 184, 160, .16); }
    .status.loading::before { content: ""; display: inline-block; width: .7em; height: .7em; margin-right: 8px; border: 2px solid var(--sage); border-top-color: var(--deep-sage); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .result-panel { display: none; margin-top: 22px; padding: clamp(22px, 5vw, 34px); border-left: 5px solid var(--peach); border-radius: 8px; animation: rise .35s ease both; }
    .result-panel.visible { display: block; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .result-kicker { margin: 0 0 4px; color: var(--muted); font-size: .82rem; font-weight: 700; }
    .emotion-line { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .emotion { margin: 0; font-family: Georgia, "Malgun Gothic", serif; font-size: 2rem; font-weight: 500; }
    .score { color: var(--deep-sage); font-size: .95rem; font-weight: 700; white-space: nowrap; }
    .score-bar { height: 7px; margin-top: -12px; margin-bottom: 26px; overflow: hidden; background: #ece8df; border-radius: 10px; }
    .score-fill { width: 0; height: 100%; background: var(--peach); border-radius: inherit; transition: width .5s ease; }
    .reflection { margin: 0 0 18px; padding-top: 18px; border-top: 1px solid var(--line); }
    .reflection:last-child { margin-bottom: 0; }
    .reflection h3 { margin: 0 0 4px; color: var(--deep-sage); font-size: .86rem; }
    .reflection p { margin: 0; }

    .history { margin-top: 26px; padding: 22px; border-radius: 8px; }
    .history[hidden] { display: none; }
    .history-title { margin: 0 0 12px; font-size: 1rem; }
    .history-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .history-item { padding: 10px 12px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 4px; font-size: .9rem; }
    .history-item time { display: block; margin-bottom: 2px; color: var(--deep-sage); font-size: .75rem; }
    .local-note { margin: 24px 0 0; color: var(--muted); font-size: .8rem; text-align: center; }

    @media (max-width: 560px) {
      .shell { width: min(100% - 24px, 780px); padding: 38px 0 48px; }
      .entry-row { display: grid; grid-template-columns: 1fr; }
      .submit-button { width: 100%; }
      .emotion-line { align-items: flex-start; flex-direction: column; gap: 4px; }
      .status-row { align-items: flex-start; flex-direction: column; }
      .retry-button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <p class="eyebrow">DAILY CHECK-IN</p>
      <h1>오늘의 마음 한 줄</h1>
      <p class="intro">지금 마음에 머무는 일을 짧게 적어보세요. 서두르지 않아도 괜찮아요.</p>
    </header>

    <section class="entry-card" aria-labelledby="entry-title">
      <h2 id="entry-title" class="field-label">오늘은 어땠나요?</h2>
      <p id="entry-hint" class="field-hint">한 줄이면 충분해요. 최대 1,000자까지 남길 수 있어요.</p>
      <form id="diary-form" novalidate>
        <div class="entry-row">
          <label class="sr-only" for="diary-input">오늘의 한 줄</label>
          <input id="diary-input" class="entry-input" name="diary" type="text" maxlength="1000" autocomplete="off" placeholder="예: 생각보다 괜찮은 하루였어" aria-describedby="entry-hint field-error" required>
          <button id="submit-button" class="submit-button" type="submit">마음 살펴보기</button>
        </div>
        <p id="field-error" class="field-error" role="alert"></p>
        <div class="status-row">
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <button id="retry-button" class="retry-button" type="button" hidden>다시 시도</button>
        </div>
      </form>
    </section>

    <section id="result-panel" class="result-panel" aria-labelledby="result-title" aria-live="polite" hidden>
      <p class="result-kicker">당신의 한 줄을 읽고</p>
      <div class="emotion-line">
        <h2 id="result-title" class="emotion"></h2>
        <span id="score" class="score"></span>
      </div>
      <div id="score-bar" class="score-bar" role="progressbar" aria-label="마음의 온도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="score-fill" class="score-fill"></div></div>
      <div class="reflection"><h3>공감</h3><p id="empathy"></p></div>
      <div class="reflection"><h3>다정한 말</h3><p id="comfort"></p></div>
      <div class="reflection"><h3>작은 다음 걸음</h3><p id="next-step"></p></div>
    </section>

    <section id="history" class="history" aria-labelledby="history-title" hidden>
      <h2 id="history-title" class="history-title">최근에 남긴 마음</h2>
      <ul id="history-list" class="history-list"></ul>
    </section>
    <p class="local-note">기록은 이 브라우저에만 저장돼요. AI 분석을 받으려면 Study-05 로컬 서버가 실행 중이어야 해요.</p>
  </main>

  <script>
    // Created and modified: 2026-09-11 21:58:00 +09:00
    (() => {
      'use strict';

      const form = document.querySelector('#diary-form');
      const input = document.querySelector('#diary-input');
      const submitButton = document.querySelector('#submit-button');
      const fieldError = document.querySelector('#field-error');
      const status = document.querySelector('#status');
      const resultPanel = document.querySelector('#result-panel');
      const historyPanel = document.querySelector('#history');
      const historyList = document.querySelector('#history-list');
      const retryButton = document.querySelector('#retry-button');
      const scoreBar = document.querySelector('#score-bar');
      const historyKey = 'study05-diary-history';
      const endpoint = window.location.protocol === 'file:' ? 'http://localhost:3011/api/diary' : '/api/diary';
      let lastDiary = '';

      const resultFields = {
        emotion: document.querySelector('#result-title'),
        score: document.querySelector('#score'),
        empathy: document.querySelector('#empathy'),
        comfort: document.querySelector('#comfort'),
        nextStep: document.querySelector('#next-step')
      };

      function setStatus(message, type) {
        status.textContent = message;
        status.className = 'status' + (type ? ' ' + type : '');
        const showRetry = type === 'error' && lastDiary;
        retryButton.hidden = !showRetry;
        retryButton.classList.toggle('visible', Boolean(showRetry));
      }

      function showValidation(message) {
        fieldError.textContent = message;
        input.setAttribute('aria-invalid', 'true');
        input.focus();
      }

      function clearValidation() {
        fieldError.textContent = '';
        input.removeAttribute('aria-invalid');
      }

      function showResult(data) {
        resultFields.emotion.textContent = data.emotion;
        resultFields.score.textContent = '마음의 온도 ' + data.emotionScore + '점';
        resultFields.empathy.textContent = data.empathy;
        resultFields.comfort.textContent = data.comfort;
        resultFields.nextStep.textContent = data.nextStep;
        document.querySelector('#score-fill').style.width = data.emotionScore + '%';
        scoreBar.setAttribute('aria-valuenow', String(data.emotionScore));
        resultPanel.hidden = false;
        resultPanel.classList.add('visible');
      }

      function hideResult() {
        resultPanel.hidden = true;
        resultPanel.classList.remove('visible');
      }

      function readHistory() {
        try {
          const saved = JSON.parse(localStorage.getItem(historyKey) || '[]');
          return Array.isArray(saved) ? saved.filter((item) => item && typeof item.text === 'string' && typeof item.createdAt === 'string').slice(0, 5) : [];
        } catch {
          return [];
        }
      }

      function renderHistory() {
        const entries = readHistory();
        historyList.replaceChildren();
        entries.forEach((entry) => {
          const item = document.createElement('li');
          item.className = 'history-item';
          const time = document.createElement('time');
          time.dateTime = entry.createdAt;
          time.textContent = new Date(entry.createdAt).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });
          item.append(time, document.createTextNode(entry.text));
          historyList.append(item);
        });
        historyPanel.hidden = entries.length === 0;
      }

      function saveHistory(text) {
        try {
          const entries = [{ text, createdAt: new Date().toISOString() }, ...readHistory()];
          localStorage.setItem(historyKey, JSON.stringify(entries.slice(0, 5)));
          renderHistory();
        } catch {
          // Private browsing or disabled storage should not block diary analysis.
        }
      }

      async function requestAnalysis(diary) {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ diary })
        });
        let body;
        try { body = await response.json(); } catch { body = {}; }
        if (!response.ok) {
          const error = new Error(body.error || 'AI 분석을 완료하지 못했습니다.');
          error.status = response.status;
          throw error;
        }
        if (!body || typeof body.emotion !== 'string' || !Number.isFinite(Number(body.emotionScore)) || typeof body.empathy !== 'string' || typeof body.comfort !== 'string' || typeof body.nextStep !== 'string') {
          throw new Error('AI 응답 형식을 확인할 수 없습니다. 잠시 후 다시 시도해 주세요.');
        }
        return { ...body, emotionScore: Math.max(0, Math.min(100, Math.round(Number(body.emotionScore)))) };
      }

      async function submitDiary(diary) {
        lastDiary = diary;
        hideResult();
        retryButton.hidden = true;
        retryButton.classList.remove('visible');
        submitButton.disabled = true;
        input.disabled = true;
        submitButton.textContent = '살펴보는 중...';
        setStatus('당신의 마음을 천천히 살펴보고 있어요.', 'loading');
        try {
          const data = await requestAnalysis(diary);
          showResult(data);
          saveHistory(diary);
          setStatus('분석이 도착했어요.', 'success');
        } catch (error) {
          const unavailable = error instanceof TypeError || error.message === 'Failed to fetch';
          const message = unavailable
            ? '로컬 서버에 연결할 수 없어요. Study-05 서버가 실행 중인지 확인해 주세요. 직접 파일을 열었다면 localhost:3011 서버가 필요해요.'
            : error.message;
          setStatus(message, 'error');
          retryButton.focus();
        } finally {
          submitButton.disabled = false;
          input.disabled = false;
          submitButton.textContent = '마음 살펴보기';
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const diary = input.value.trim();
        clearValidation();
        if (!diary) return showValidation('오늘의 한 줄을 먼저 적어주세요.');
        if (diary.length > 1000) return showValidation('내용은 1,000자 이하로 적어주세요.');
        await submitDiary(diary);
      });

      retryButton.addEventListener('click', () => {
        if (lastDiary) submitDiary(lastDiary);
      });
      input.addEventListener('input', clearValidation);
      renderHistory();
    })();
  </script>
</body>
</html>
