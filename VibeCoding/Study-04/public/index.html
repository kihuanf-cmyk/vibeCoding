<!doctype html>
<!-- Created: 2026-09-11 19:47:57 +09:00 -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>냉장고 재료 인식</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header class="masthead"><p class="eyebrow">KITCHEN SCAN / STEP 02</p><h1>냉장고 안을<br><em>레시피의 시작</em>으로.</h1><p class="intro">찾은 재료를 바탕으로 오늘 만들 요리를 고릅니다.</p></header>
    <section class="workspace" aria-label="재료 인식">
      <div class="upload-panel">
        <div id="dropzone" class="dropzone"><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden><div class="upload-mark">+</div><h2>냉장고 사진을 놓아주세요</h2><p>JPEG, PNG, WebP · 최대 10MB</p><button id="chooseButton" class="button primary" type="button">사진 선택</button></div>
        <div id="previewWrap" class="preview-wrap" hidden><img id="preview" alt="선택한 냉장고 사진"><button id="clearButton" class="button subtle" type="button">다른 사진 선택</button></div>
        <button id="recognizeButton" class="button action" type="button" disabled>재료 인식하기 <span>→</span></button>
      </div>
      <aside class="result-panel"><div class="panel-heading"><p class="eyebrow">RECOGNITION RESULT</p><h2>발견한 재료</h2></div><div id="status" class="status" role="status">사진을 올리면 인식 결과가 여기에 나타납니다.</div><div id="results" class="results"></div><p id="notes" class="notes"></p><div class="recipe-controls"><label>인분 <input id="servings" type="number" min="1" max="12" value="2"></label><label>최대 시간 <input id="maxMinutes" type="number" min="5" max="180" value="30">분</label><label>난이도 <select id="difficulty"><option value="easy">쉬움</option><option value="medium">보통</option><option value="hard">어려움</option></select></label><label class="wide">피할 재료 <input id="avoid" type="text" placeholder="예: 땅콩, 고수"></label></div><button id="recipeButton" class="button recipe-action" type="button" disabled>이 재료로 레시피 추천 <span>→</span></button><div id="recipes" class="recipes"></div></aside>
    </section>
    <section class="account-area" aria-label="사용자 프로필과 저장 레시피">
      <div class="profile-panel"><p class="eyebrow">YOUR KITCHEN PROFILE</p><h2>내 취향 저장</h2><form id="profileForm"><label>이름 <input id="displayName" required maxlength="40" placeholder="이름을 입력하세요"></label><label>기본 인분 <input id="defaultServings" type="number" min="1" max="12" value="2"></label><label>기본 조리 시간 <input id="defaultMinutes" type="number" min="5" max="180" value="30"></label><label>식단 <select id="diet"><option value="none">제한 없음</option><option value="vegetarian">채식</option><option value="vegan">비건</option><option value="low-carb">저탄수화물</option></select></label><label>알레르기 <input id="allergies" placeholder="예: 땅콩, 우유"></label><label>피할 재료 <input id="avoidIngredients" placeholder="예: 고수"></label><button class="button primary" type="submit">프로필 저장</button><button id="deleteProfile" class="button subtle" type="button">전체 데이터 삭제</button></form><p id="profileStatus" class="status" role="status"></p></div>
      <div class="saved-panel"><div class="panel-heading"><p class="eyebrow">SAVED RECIPES</p><h2>저장한 레시피</h2></div><div class="saved-tools"><input id="savedSearch" placeholder="레시피 또는 재료 검색"><select id="savedSort"><option value="latest">최근 저장순</option><option value="title">제목순</option></select></div><div id="savedRecipes" class="saved-recipes"></div></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
