<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handwritten Digit Recognizer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <style>
    :root {
      --ink: #18212b;
      --muted: #64717d;
      --paper: #f7f4ed;
      --panel: #fffdf8;
      --line: #d9d3c8;
      --accent: #e4572e;
      --accent-dark: #b73b1c;
      --shadow: 0 20px 60px rgba(35, 33, 27, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 15%, rgba(228, 87, 46, 0.12), transparent 24rem),
        linear-gradient(135deg, #f7f4ed 0%, #ece7dc 100%);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 60px 0;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent-dark);
      font: 700 12px/1.2 Arial, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(42px, 7vw, 76px);
      line-height: 0.95;
      letter-spacing: -0.03em;
    }

    .intro {
      max-width: 570px;
      margin: 22px 0 38px;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.5;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(260px, 0.8fr);
      gap: 22px;
      align-items: stretch;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .draw-panel { padding: 22px; }

    .panel-title {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      font: 700 13px/1.2 Arial, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .canvas-wrap {
      aspect-ratio: 1;
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 4px;
      background: #101820;
      cursor: crosshair;
      touch-action: none;
    }

    canvas { display: block; width: 100%; height: 100%; }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      border-radius: 4px;
      color: var(--ink);
      background: transparent;
      font: 700 13px Arial, sans-serif;
      cursor: pointer;
    }

    button:hover { background: #f0ece3; }

    .primary {
      flex: 1;
      border-color: var(--accent);
      color: white;
      background: var(--accent);
    }

    .primary:hover { background: var(--accent-dark); }

    button:disabled { cursor: wait; opacity: 0.55; }

    .result-panel {
      display: flex;
      min-height: 100%;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px;
    }

    .result-label {
      color: var(--muted);
      font: 700 12px Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .result-digit {
      margin: 20px 0 8px;
      color: var(--accent);
      font-size: clamp(120px, 20vw, 210px);
      line-height: 0.8;
    }

    .confidence {
      margin: 0;
      font-size: 24px;
    }

    .status {
      min-height: 42px;
      margin: 32px 0 0;
      color: var(--muted);
      font: 14px/1.5 Arial, sans-serif;
    }

    .scores {
      display: grid;
      gap: 8px;
      margin-top: 22px;
      font: 12px Arial, sans-serif;
    }

    .score-row {
      display: grid;
      grid-template-columns: 18px 1fr 42px;
      gap: 8px;
      align-items: center;
    }

    .bar { height: 6px; background: #e9e4da; }
    .bar span { display: block; height: 100%; background: var(--accent); }

    @media (max-width: 700px) {
      main { padding: 34px 0; }
      .workspace { grid-template-columns: 1fr; }
      .result-panel { min-height: 360px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">MNIST / TensorFlow.js</p>
    <h1>Write a digit.<br>Let the model read it.</h1>
    <p class="intro">Draw one handwritten number in the square. The neural network will compare it with the MNIST dataset and return its best prediction.</p>

    <section class="workspace" aria-label="Digit recognition workspace">
      <div class="panel draw-panel">
        <div class="panel-title"><span>Input canvas</span><span>0 - 9</span></div>
        <div class="canvas-wrap"><canvas id="drawingCanvas" width="280" height="280" aria-label="Draw a handwritten digit here"></canvas></div>
        <div class="actions">
          <button id="clearButton" type="button">Clear</button>
          <button id="recognizeButton" class="primary" type="button" disabled>Loading model...</button>
        </div>
      </div>

      <div class="panel result-panel">
        <div>
          <div class="result-label">Prediction</div>
          <div id="resultDigit" class="result-digit" aria-live="polite">-</div>
          <p id="confidence" class="confidence">Draw a digit to begin</p>
          <p id="status" class="status">Loading the pretrained MNIST model...</p>
        </div>
        <div id="scores" class="scores" aria-label="Prediction confidence scores"></div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("drawingCanvas");
    const context = canvas.getContext("2d");
    const clearButton = document.getElementById("clearButton");
    const recognizeButton = document.getElementById("recognizeButton");
    const resultDigit = document.getElementById("resultDigit");
    const confidence = document.getElementById("confidence");
    const status = document.getElementById("status");
    const scores = document.getElementById("scores");
    let model;
    let drawing = false;

    function clearCanvas() {
      context.fillStyle = "#101820";
      context.fillRect(0, 0, canvas.width, canvas.height);
      resultDigit.textContent = "-";
      confidence.textContent = "Draw a digit to begin";
      scores.innerHTML = "";
    }

    function positionFromEvent(event) {
      const bounds = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - bounds.left) * canvas.width / bounds.width,
        y: (event.clientY - bounds.top) * canvas.height / bounds.height
      };
    }

    function startDrawing(event) {
      drawing = true;
      const point = positionFromEvent(event);
      context.beginPath();
      context.moveTo(point.x, point.y);
      context.lineCap = "round";
      context.lineJoin = "round";
      context.lineWidth = 22;
      context.strokeStyle = "#ffffff";
      context.lineTo(point.x + 0.01, point.y + 0.01);
      context.stroke();
      canvas.setPointerCapture(event.pointerId);
    }

    function draw(event) {
      if (!drawing) return;
      const point = positionFromEvent(event);
      context.lineTo(point.x, point.y);
      context.stroke();
    }

    function stopDrawing() {
      drawing = false;
      context.closePath();
    }

    function createInputTensor() {
      const smallCanvas = document.createElement("canvas");
      smallCanvas.width = 28;
      smallCanvas.height = 28;
      const smallContext = smallCanvas.getContext("2d");
      smallContext.fillStyle = "#000000";
      smallContext.fillRect(0, 0, 28, 28);
      smallContext.drawImage(canvas, 0, 0, 28, 28);
      return tf.tidy(() => {
        const pixels = tf.browser.fromPixels(smallCanvas, 1).toFloat();
        return pixels.div(255).reshape([1, 28, 28, 1]);
      });
    }

    function renderScores(probabilities) {
      scores.innerHTML = probabilities.map((value, digit) => `
        <div class="score-row">
          <strong>${digit}</strong>
          <div class="bar"><span style="width: ${value * 100}%"></span></div>
          <span>${(value * 100).toFixed(1)}%</span>
        </div>
      `).join("");
    }

    async function recognize() {
      if (!model) return;
      recognizeButton.disabled = true;
      status.textContent = "Analyzing your handwriting...";
      const input = createInputTensor();
      const prediction = model.predict(input);
      const probabilities = await prediction.data();
      const bestDigit = probabilities.indexOf(Math.max(...probabilities));
      const bestConfidence = probabilities[bestDigit] * 100;
      resultDigit.textContent = bestDigit;
      confidence.textContent = `${bestConfidence.toFixed(1)}% confidence`;
      status.textContent = "Prediction complete. Try another digit whenever you like.";
      renderScores(Array.from(probabilities));
      input.dispose();
      prediction.dispose();
      recognizeButton.disabled = false;
    }

    async function loadModel() {
      try {
        model = await tf.loadLayersModel("https://storage.googleapis.com/tfjs-models/tfjs/mnist_transfer_cnn_v1/model.json");
        recognizeButton.disabled = false;
        recognizeButton.textContent = "Recognize digit";
        status.textContent = "Model ready. Write one digit in the canvas.";
      } catch (error) {
        status.textContent = "The model could not be loaded. Check your internet connection and refresh the page.";
        console.error(error);
      }
    }

    clearButton.addEventListener("click", clearCanvas);
    recognizeButton.addEventListener("click", recognize);
    canvas.addEventListener("pointerdown", startDrawing);
    canvas.addEventListener("pointermove", draw);
    canvas.addEventListener("pointerup", stopDrawing);
    canvas.addEventListener("pointercancel", stopDrawing);
    clearCanvas();
    loadModel();
  </script>
</body>
</html>
